[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berkios"
version = "5.29.0"
description = "Local-first development agent runtime for iBook"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<7.0",
    "openai>=1.0.0"
]

[tool.setuptools.packages.find]
include = ["berkios*"]
exclude = ["nginx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
