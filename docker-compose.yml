services:
  postgres:
    image: postgres:16-alpine
    container_name: berkios_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [berkios_net]

  redis:
    image: redis:7-alpine
    container_name: berkios_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [berkios_net]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berkios_api
    restart: unless-stopped
    env_file: .env
    environment:
      BERKIOS_ENV: production
      BERKIOS_HOST: 0.0.0.0
      BERKIOS_PORT: 8000
      BERKIOS_REDIS_URL: redis://redis:6379/0
      BERKIOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - berkios_data:/var/lib/berkios
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [berkios_net]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berkios_worker
    restart: unless-stopped
    command: ["python", "-m", "berkios.worker"]
    env_file: .env
    environment:
      BERKIOS_ENV: production
      BERKIOS_REDIS_URL: redis://redis:6379/0
      BERKIOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - berkios_data:/var/lib/berkios
    networks: [berkios_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: berkios_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [berkios_net]

volumes:
  postgres_data:
  redis_data:
  berkios_data:

networks:
  berkios_net:
    name: berkios_net
